<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect width="120" height="120" rx="30" fill="url(#bgGrad)" />
  <rect width="116" height="116" x="2" y="2" rx="28" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Quantum Orbit Ring -->
  <ellipse cx="60" cy="60" rx="42" ry="24" fill="none" stroke="url(#glowGrad)" stroke-width="2" stroke-dasharray="6,4" transform="rotate(-25 60 60)" opacity="0.8" />
  <circle cx="28" cy="46" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="92" cy="74" r="3.5" fill="#a855f7" filter="url(#glow)" />

  <!-- Central Hologram Head / Bot Silhouette -->
  <rect x="36" y="34" width="48" height="42" rx="14" fill="#080f1e" stroke="url(#coreGrad)" stroke-width="2.5" filter="url(#glow)" />

  <!-- AI Friendly Visor / Screen -->
  <rect x="42" y="44" width="36" height="18" rx="8" fill="#031525" />

  <!-- Glowing Intelligent Cyan Eyes -->
  <circle cx="51" cy="53" r="3.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="69" cy="53" r="3.5" fill="#38bdf8" filter="url(#glow)" />

  <!-- Neural Antenna / Spark Node -->
  <line x1="60" y1="34" x2="60" y2="24" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="60" cy="22" r="4.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="60" cy="22" r="2" fill="#ffffff" />

  <!-- Stylized 'M' Engineering Crest -->
  <path d="M48 88 L54 78 L60 84 L66 78 L72 88" fill="none" stroke="url(#glowGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Sparkles -->
  <path d="M88 28 L90 22 L92 28 L98 30 L92 32 L90 38 L88 32 L82 30 Z" fill="#fbbf24" filter="url(#glow)" opacity="0.9" />
</svg>

